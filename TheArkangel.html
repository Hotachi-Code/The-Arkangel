let AC = null, master = null, muted = false, NB = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol = 0.2, freq = 1000, delay = 0) {
  if (!AC || muted) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.05);
}

};
const lastS = {};
function sfx(n) { const now = performance.now(); if (lastS[n] && now - lastS[n] < 45) return; lastS[n] = now; SFX[n](); }

let musT = 0, musStep = 0;
const SCALE = [0, 3, 5, 7, 10, 12, 15];
const ROOTS = [55, 51.91, 49, 46.25, 58.27, 43.65, 41.2];
function updateMusic(dt) {
  if (!AC || muted) return;
  musT -= dt; if (musT > 0) return;
  const boss = state === 'play' && G && G.bossAlive;
  const tempo = boss ? 0.19 : (state === 'play' ? 0.4 : 0.6);
  musT += tempo; musStep++;
  const root = G && state !== 'title' && state !== 'story' ? (G.hub ? 65.4 : ROOTS[G.ring]) : ROOTS[6];
  if (musStep % 4 === 0) tone(root * (boss ? 2 : 1), tempo * 3.6, 'triangle', boss ? 0.11 : 0.08);
  if (boss && musStep % 2 === 1) tone(root * 2, tempo * 0.9, 'sawtooth', 0.025, -root);
  if (Math.random() < (boss ? 0.6 : 0.38)) tone(root * 4 * Math.pow(2, choice(SCALE) / 12), tempo * 2, 'sine', 0.025);
}

const keys = {}; const mouse = { x: W / 2, y: H / 2, down: false };

  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();

addEventListener('keyup', e => keys[e.code] = false);
function mpos(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('mousemove', mpos);
cv.addEventListener('mousedown', e => { mpos(e); audioInit(); if (e.button === 0) mouse.down = true; onClick(e.button); });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

function toggleFS() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } }

// ---------- érintéses vezérlés (telefon / tablet) ----------
// Bal térfél: mozgás-joystick. Jobb térfél: célzó-joystick (húzva lő; csak érintve a legközelebbi démonra lő).
// Gombok: kitérés, Szent Nova, vásárlás, szünet.
const touch = {
  on: matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window,
  move: null, aim: null, btns: {},
};
const TB = {
  dash: { x: W - 80, y: H - 80, r: 44, label: 'KITÉRÉS' },
  nova: { x: W - 190, y: H - 52, r: 34, label: 'NOVA' },
  use: { x: W - 175, y: H - 155, r: 32, label: 'VÉTEL' },
  swap: { x: W - 62, y: H - 192, r: 28, label: 'FEGYVER' },
  pause: { x: 742, y: 32, r: 20, label: '' },
};
function tpos(t) { const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H }; }
function nearShopItem() {
  if (!G || G.room.type !== 'shop') return null;
  for (const it of G.room.items) if (!it.sold && dist(it, G.p) <= 40) return it;
  return null;
}
function tbVisible(k) { return k !== 'use' || !!nearShopItem(); }
function tryLandscape() {
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }
}
function touchStart(e) {
  e.preventDefault(); touch.on = true; audioInit();
  for (const t of e.changedTouches) {
    const q = tpos(t);
    if (state !== 'play') {
      // harc közben érkező érintések ne válasszanak/indítsanak véletlenül
      if ((state === 'dead' || state === 'win') && gt < 1.2) continue;
      if (state === 'choice' && performance.now() - G.choice.at < 700) continue;
      mouse.x = q.x; mouse.y = q.y;
      if (state === 'title') tryLandscape();
      if (state === 'pause' && q.y > 470) state = 'title';
      else onClick(0);
      continue;
    }
    let hit = null;
    for (const k in TB) { const b = TB[k]; if (tbVisible(k) && Math.hypot(q.x - b.x, q.y - b.y) < b.r + 14) { hit = k; break; } }
    if (hit) {
      touch.btns[t.identifier] = hit;
      if (hit === 'dash') dash(); else if (hit === 'nova') nova(); else if (hit === 'use') interact(); else if (hit === 'swap') swapWeapon(); else if (hit === 'pause') state = 'pause';
    } else if (q.x < W / 2) { if (!touch.move) touch.move = { id: t.identifier, ox: q.x, oy: q.y, x: q.x, y: q.y }; }
    else if (!touch.aim) touch.aim = { id: t.identifier, ox: q.x, oy: q.y, x: q.x, y: q.y };
  }
}
function touchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const q = tpos(t);
    for (const k of ['move', 'aim']) {
      const s = touch[k]; if (!s || s.id !== t.identifier) continue;
      s.x = q.x; s.y = q.y;
      const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), mx = 70;
      if (d > mx) { s.ox = s.x - dx / d * mx; s.oy = s.y - dy / d * mx; } // a joystick követi az ujjat
    }
  }
}
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touch.move && touch.move.id === t.identifier) touch.move = null;
    if (touch.aim && touch.aim.id === t.identifier) touch.aim = null;
    delete touch.btns[t.identifier];
  }
}
addEventListener('touchstart', touchStart, { passive: false });
addEventListener('touchmove', touchMove, { passive: false });
addEventListener('touchend', touchEnd, { passive: false });
addEventListener('touchcancel', touchEnd, { passive: false });
addEventListener('blur', () => { touch.move = touch.aim = null; touch.btns = {}; });
function touchMoveDir() {
  const s = touch.move; if (!s) return null;
  const dx = s.x - s.ox, dy = s.y - s.oy; if (Math.hypot(dx, dy) < 10) return null;
  return { x: dx, y: dy };
}

function updBoss(b, dt) {
  if (b.intro > 0) { b.intro -= dt; return; }
  if (b.inv > 0) b.inv -= dt;
  if (b.key === 'lucifer') {
    const ph = b.hp < b.maxHp * 0.33 ? 3 : b.hp < b.maxHp * 0.66 ? 2 : 1;
    if (ph > b.phase) {
      b.phase = ph; b.inv = 1.6; b.atk = null; b.gap = 1.6; b.ghost = false; b.alpha = 1; b.tele = null; b.cs = undefined;
      G.bullets = G.bullets.filter(q => q.f); G.beams.length = 0; G.shake = 18; sfx('roar');
      if (ph === 3) b.sm = 1 + G.lvl * 0.04 + 0.25;
      G.banner = { title: 'LUCIFER', sub: ph === 2 ? 'A Hajnalcsillag haragja' : 'A Bukott Fény utolsó lángja',
        line: ph === 2 ? '„Én vagyok a Fényhozó! Előttem a csillagok is meghajolnak!”' : '„Ha nem uralkodhatom a Mennyben, akkor semmi se maradjon!”', t: 0, dur: 3.2, col: '#c08bff' };
      part(b.x, b.y, '#c08bff', 120, 500, 1.2, 5);
    }
  }
  if (b.key === 'leviathan') { b.trail.unshift({ x: b.x, y: b.y }); if (b.trail.length > 60) b.trail.pop(); }
  const rage = 1 + (1 - b.hp / b.maxHp) * 0.35;
  if (!b.atk) {
    b.gap -= dt * rage;
    const d = Math.hypot(b.tx - b.x, b.ty - b.y);
    if (d < 20) { const q = freePos(110, 180); b.tx = q.x; b.ty = q.y; }
    else { b.x += (b.tx - b.x) / d * b.spd * dt; b.y += (b.ty - b.y) / d * b.spd * dt; }
    if (b.gap <= 0) {
      const list = b.key === 'lucifer' ? LUC_PHASES[b.phase] : b.bd.atk;
      let a; do { a = choice(list); } while (a === b.lastAtk && list.length > 1);
      b.atk = a; b.lastAtk = a; b.at = 0; b.ac = 0; b.shotT = 0; b.cs = undefined; b.tp = 0;
    }
  } else {
    b.at += dt;
    if (ATK[b.atk](b, dt)) {

      b.gap = Math.max(0.35, (b.phase === 3 ? 0.4 : 0.95 - G.lvl * 0.05));

// ---------- ütközés ----------
function circRect(c, o, r) {
  const nx = clamp(c.x, o.x, o.x + o.w), ny = clamp(c.y, o.y, o.y + o.h);
  const dx = c.x - nx, dy = c.y - ny, d2 = dx * dx + dy * dy;
  return d2 < r * r ? { dx, dy, d: Math.sqrt(d2) } : null;
}
function collideObst(c) {
  for (const o of G.room.obst) {
    const h = circRect(c, o, c.r);
    if (!h) continue;
    if (h.d > 0.001) { c.x += h.dx / h.d * (c.r - h.d); c.y += h.dy / h.d * (c.r - h.d); }
    else { // a középpont a dobozban: a legközelebbi oldalra toljuk
      const l = c.x - o.x, r = o.x + o.w - c.x, t = c.y - o.y, bb = o.y + o.h - c.y, m = Math.min(l, r, t, bb);
      if (m === l) c.x = o.x - c.r; else if (m === r) c.x = o.x + o.w + c.r; else if (m === t) c.y = o.y - c.r; else c.y = o.y + o.h + c.r;
    }
    c.hitWall = true;
  }
}
function clampRoom(c) {
  if (c.x < L + c.r) { c.x = L + c.r; c.hitWall = true; }
  if (c.x > R - c.r) { c.x = R - c.r; c.hitWall = true; }
  if (c.y < T + c.r) { c.y = T + c.r; c.hitWall = true; }
  if (c.y > B - c.r) { c.y = B - c.r; c.hitWall = true; }
}
function segDist(px, py, x, y, a, len) {
  const dx = Math.cos(a), dy = Math.sin(a), t = clamp((px - x) * dx + (py - y) * dy, 0, len);
  return Math.hypot(px - (x + dx * t), py - (y + dy * t));
}

// ---------- frissítés ----------
function update(dt) {
  const p = G.p, room = G.room;
  G.time += dt; G.roomT += dt; p.t += dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt * 3);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  if (G.hurtFx > 0) G.hurtFx -= dt;
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }

  if (G.dying > 0) {
    G.dying -= dt;
    if (G.dying <= 0) { state = 'dead'; gt = 0; saveBest(false); }
  } else updatePlayer(dt);

  // ellenségek
  for (let i = 0; i < G.enemies.length; i++) updEnemy(G.enemies[i], dt);
  const en = G.enemies;
  for (let i = 0; i < en.length; i++) for (let j = i + 1; j < en.length; j++) {
    const a = en[i], b = en[j]; if (a.boss || b.boss || a.dead || b.dead) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
    if (d < m && d > 0.01) { const k = (m - d) / d * 0.5; a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k; }
  }
  G.enemies = G.enemies.filter(e => !e.dead);

  updateBullets(dt);

  // veszélyzónák
  for (const h of G.hazards) {
    if (h.warn > 0) { h.warn -= dt; continue; }

function updatePlayer(dt) {

function mv(e, a, s, dt) { e.x += Math.cos(a) * s * dt; e.y += Math.sin(a) * s * dt; }

function updateBullets(dt) {
  const p = G.p, obst = G.room.obst;
  for (const b of G.bullets) {
    if (b.dead) continue;
    if (b.f && p.homing) {
      let best = null, bd = 340;
      for (const e of G.enemies) { if (e.dead || e.ghost || e.spawn > 0) continue; const d = dist(e, b); if (d < bd) { bd = d; best = e; } }

    if (b.life <= 0) { b.dead = true; if (b.burst) { radial(b.x, b.y, b.burst, 160, rand(0, 1), { col: '#c8dcff' }); part(b.x, b.y, '#c8dcff', 12, 150, 0.4, 3); } continue; }
    if (b.x < L + b.r || b.x > R - b.r || b.y < T + b.r || b.y > B - b.r) {

        b.x = clamp(b.x, L + b.r, R - b.r); b.y = clamp(b.y, T + b.r, B - b.r); b.bounce--;

    }
    let hitO = false;
    for (const o of obst) if (b.x > o.x - b.r && b.x < o.x + o.w + b.r && b.y > o.y - b.r && b.y < o.y + o.h + b.r) { hitO = true; break; }
    if (hitO) { b.dead = true; part(b.x, b.y, b.f ? '#fff2b0' : b.col, 3, 80, 0.25, 2); continue; }
    if (b.f) {
      for (const e of G.enemies) {

        if (dist(e, b) < e.r + b.r) {

        }

      if (p.orbs) {
        for (let i = 0; i < p.orbs; i++) {
          const a = G.orbA + i * TAU / p.orbs;
          if (Math.hypot(p.x + Math.cos(a) * 48 - b.x, p.y + Math.sin(a) * 48 - b.y) < 9 + b.r) { b.dead = true; part(b.x, b.y, '#fff2b0', 4, 100, 0.3, 2); break; }
        }
        if (b.dead) continue;
      }
      if (!G.dying && Math.hypot(p.x - b.x, p.y - b.y) < p.r - 4 + b.r) {
        if (p.inv <= 0 && p.dashT <= 0) { hurtPlayer(b.dmg); b.dead = true; }

}

    const col = room.type === 'boss' ? rg.col : room.type === 'treasure' ? '#ffd75e' : '#ffffff';
    g.strokeStyle = hexA(col, room.type === 'start' ? 0.08 : 0.18); g.lineWidth = 3;
    g.beginPath(); g.arc(CX, CY, 150, 0, TAU); g.stroke(); g.beginPath(); g.arc(CX, CY, 130, 0, TAU); g.stroke();
    g.beginPath();
    for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + i * TAU * 2 / 5; const x = CX + Math.cos(a) * 130, y = CY + Math.sin(a) * 130; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    if (room.type !== 'boss') { g.beginPath(); for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; g.moveTo(CX + Math.cos(a) * 130, CY + Math.sin(a) * 130); g.lineTo(CX + Math.cos(a) * 150, CY + Math.sin(a) * 150); } }
    g.stroke();
  }
  for (const o of room.obst) {
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(o.x + 5, o.y + 7, o.w, o.h);
    g.fillStyle = rg.wall; g.fillRect(o.x, o.y, o.w, o.h);
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(o.x, o.y, o.w, 5);
    g.strokeStyle = hexA(rg.col, 0.35); g.lineWidth = 1.5; g.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.moveTo(o.x + 4, o.y + o.h * 0.6); g.lineTo(o.x + o.w * 0.5, o.y + o.h * 0.4); g.lineTo(o.x + o.w - 4, o.y + o.h * 0.7); g.stroke();
  }
  if (false) {
    g.fillStyle = 'rgba(255,255,255,0.22)'; g.font = `14px ${SANS}`; g.textAlign = 'center';
    g.fillText(touch.on ? 'Bal hüvelykujj: mozgás   •   Jobb hüvelykujj: lövés   •   KITÉRÉS és NOVA gomb' : 'WASD: mozgás   •   Bal egérgomb / nyilak: lövés   •   Space: kitérés   •   Q / jobb klikk: Szent Nova', CX, B - 40);
    g.fillText('Tisztítsd meg a termeket, keresd meg a gyűrű démonát (piros ajtó a térképen).', CX, B - 20);
  }
  return c;
}

function decorate(g, room) {
  const blob = (x, y, rx, ry, c) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rand(0, 3), 0, TAU); g.fill(); };
  const ok = (x, y, m = 30) => !room.obst.some(o => x > o.x - m && x < o.x + o.w + m && y > o.y - m && y < o.y + o.h + m);
  const spots = (n, f) => { for (let i = 0; i < n; i++) { const x = rand(L + 30, R - 30), y = rand(T + 30, B - 30); if (ok(x, y)) f(x, y); } };
  if (room.type === 'hub') {
    // fehér márvány mozaik, hétágú csillag, lépcsőfokok
    g.save(); g.translate(CX, CY + 40);
    for (let i = 0; i < 6; i++) { g.strokeStyle = `rgba(200,220,255,${0.05 + i * 0.015})`; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 60 + i * 34, 0, TAU); g.stroke(); }
    g.strokeStyle = 'rgba(220,235,255,0.22)'; g.lineWidth = 2; g.beginPath();
    for (let i = 0; i <= 7; i++) { const a = -Math.PI / 2 + i * TAU * 3 / 7; i ? g.lineTo(Math.cos(a) * 150, Math.sin(a) * 150) : g.moveTo(Math.cos(a) * 150, Math.sin(a) * 150); }
    g.stroke();
    for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + i * TAU / 7; g.fillStyle = hexA(RINGS[i].col, 0.25); g.beginPath(); g.arc(Math.cos(a) * 175, Math.sin(a) * 175, 7, 0, TAU); g.fill(); }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.03)'; for (let i = 0; i < 4; i++) g.fillRect(L, B - 18 - i * 10, R - L, 2);
    for (let i = 0; i < 26; i++) blob(rand(L, R), rand(T, B), rand(30, 80), rand(10, 25), 'rgba(200,220,255,0.025)');
    return;
  }
  const ri = G.ring;
  if (ri === 0) { // vágy örvénye
    g.lineWidth = 2;
    for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(255,120,190,${rand(0.05, 0.12)})`; const x = rand(L, R), y = rand(T, B), r = rand(30, 90); g.beginPath(); g.arc(x, y, r, rand(0, 3), rand(3.5, 6)); g.stroke(); }
    spots(40, (x, y) => blob(x, y, rand(3, 6), rand(2, 3), `rgba(255,${randi(60, 140)},${randi(140, 200)},0.45)`));
  } else if (ri === 1) { // nyálka és csontok
    spots(10, (x, y) => { blob(x, y, rand(30, 70), rand(14, 30), 'rgba(140,170,30,0.18)'); blob(x + 5, y - 3, rand(10, 25), rand(5, 12), 'rgba(200,230,80,0.12)'); });
    spots(14, (x, y) => { g.strokeStyle = 'rgba(230,220,190,0.35)'; g.lineWidth = 3; g.beginPath(); const a = rand(0, 3); g.moveTo(x - Math.cos(a) * 9, y - Math.sin(a) * 9); g.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); g.stroke(); });
  } else if (ri === 2) { // szétszórt arany
    spots(70, (x, y) => { blob(x, y, rand(3, 5), rand(2, 3), `rgba(255,${randi(190, 225)},60,${rand(0.35, 0.7)})`); });
    for (const [x, y] of [[L + 40, T + 40], [R - 40, T + 40], [L + 40, B - 40], [R - 40, B - 40]]) for (let i = 0; i < 18; i++) blob(x + rand(-22, 22), y + rand(-14, 14), 5, 3, `rgba(255,${randi(180, 220)},50,0.6)`);
  } else if (ri === 3) { // mocsár
    spots(9, (x, y) => { blob(x, y, rand(40, 90), rand(18, 34), 'rgba(20,35,55,0.55)'); g.strokeStyle = 'rgba(140,170,220,0.12)'; g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, 20, 8, 0, 0, TAU); g.stroke(); });
    spots(30, (x, y) => blob(x, y, rand(4, 10), rand(2, 4), 'rgba(70,110,80,0.25)'));
  } else if (ri === 4) { // izzó lávarepedések
    g.shadowColor = '#ff6a1a'; g.shadowBlur = 12; g.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      let x = rand(L, R), y = rand(T, B); g.strokeStyle = `rgba(255,${randi(90, 150)},30,${rand(0.4, 0.7)})`; g.lineWidth = rand(1.5, 3.5);
      g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 7; k++) { x += rand(-34, 34); y += rand(-34, 34); g.lineTo(clamp(x, L, R), clamp(y, T, B)); } g.stroke();
    }
    g.shadowBlur = 0;
  } else if (ri === 5) { // zöld kristályok
    spots(12, (x, y) => {
      for (let k = 0; k < 4; k++) {
        const a = -Math.PI / 2 + rand(-0.7, 0.7), h = rand(12, 26), w = rand(4, 7), bx = x + rand(-8, 8);
        g.fillStyle = `rgba(${randi(40, 90)},${randi(200, 240)},${randi(120, 160)},0.35)`; g.beginPath();
        g.moveTo(bx - w, y); g.lineTo(bx + Math.cos(a) * h, y + Math.sin(a) * h); g.lineTo(bx + w, y); g.closePath(); g.fill();
      }
    });
  } else if (ri === 6) { // jég és dér
    for (let i = 0; i < 14; i++) blob(rand(L, R), rand(T, B), rand(40, 110), rand(20, 50), 'rgba(200,190,255,0.05)');
    g.strokeStyle = 'rgba(230,220,255,0.25)'; g.lineWidth = 1;
    for (let i = 0; i < 16; i++) { let x = rand(L, R), y = rand(T, B); g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += rand(-40, 40); y += rand(-40, 40); g.lineTo(x, y); } g.stroke(); }
  }
}

const TORCH_X = [200, 340, 620, 760];
function drawTorches() {
  const col = G.hub ? '#9fd0ff' : RG().col;
  for (const x of TORCH_X) {
    const y = 80, f = 1 + Math.sin(gt * 13 + x) * 0.12 + Math.sin(gt * 7.3 + x * 2) * 0.08;

    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(x, y - 4, 1, x, y - 4, 26 * f); gr.addColorStop(0, hexA(col, 0.7)); gr.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y - 4, 26 * f, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.ellipse(x, y - 5, 3.5, 7 * f, 0, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawGate(g) {
  const ri = g.ri, rg = RINGS[ri], big = ri === 6, done = G.defeated.includes(ri), locked = big && G.defeated.length < 6;
  const w = big ? 38 : 28, top = g.y - (big ? 40 : 28), base = g.y + 28;
  const arch = r => { ctx.beginPath(); ctx.moveTo(g.x - r, base); ctx.lineTo(g.x - r, top); ctx.arc(g.x, top, r, Math.PI, 0); ctx.lineTo(g.x + r, base); ctx.closePath(); };
  if (!done) {
    const fg = ctx.createRadialGradient(g.x, base, 4, g.x, base, 80); fg.addColorStop(0, hexA(rg.col, locked ? 0.15 : 0.4)); fg.addColorStop(1, hexA(rg.col, 0));
    ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(g.x, base, 80, 26, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(g.x, base + 2, w + 16, 8, 0, 0, TAU); ctx.fill();
  const sg = ctx.createLinearGradient(g.x - w - 10, 0, g.x + w + 10, 0); sg.addColorStop(0, '#363c4d'); sg.addColorStop(0.5, done ? '#5b6170' : '#8a93a8'); sg.addColorStop(1, '#2b3040');
  ctx.fillStyle = sg; arch(w + 9); ctx.fill();
  ctx.strokeStyle = done ? 'rgba(0,0,0,0.4)' : hexA(rg.col, 0.6); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.save(); arch(w); ctx.clip();
  if (done) {
    ctx.fillStyle = '#121419'; ctx.fillRect(g.x - w, top - w, w * 2, base - top + w);
    ctx.strokeStyle = 'rgba(255,230,160,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(g.x, top - 12); ctx.lineTo(g.x, base - 8); ctx.moveTo(g.x - 12, top + 4); ctx.lineTo(g.x + 12, top + 4); ctx.stroke();
  } else {
    const ig = ctx.createRadialGradient(g.x, g.y, 2, g.x, g.y, w * 2.2);
    ig.addColorStop(0, locked ? '#2a1c40' : '#ffffff'); ig.addColorStop(0.3, hexA(rg.col, locked ? 0.35 : 0.9)); ig.addColorStop(1, '#05030a');
    ctx.fillStyle = ig; ctx.fillRect(g.x - w, top - w, w * 2, base - top + w);
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = hexA(rg.col, locked ? 0.15 : 0.45); ctx.lineWidth = 2;
      const r0 = 8 + k * 9, sp = gt * (k % 2 ? 1.8 : -1.4);
      ctx.beginPath(); ctx.ellipse(g.x, g.y - 4, r0, r0 * 1.4, 0, sp, sp + 4.2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  if (locked) {
    ctx.strokeStyle = '#4a4458'; ctx.lineWidth = 4; ctx.setLineDash([7, 4]);
    ctx.beginPath(); ctx.moveTo(g.x - w, top); ctx.lineTo(g.x + w, base - 6); ctx.moveTo(g.x + w, top); ctx.lineTo(g.x - w, base - 6); ctx.stroke(); ctx.setLineDash([]);
    for (let k = 0; k < 6; k++) {
      if (G.defeated.includes(k)) continue;
      const q = lockPos(k), c = RINGS[k].col, bob = Math.sin(gt * 2 + k) * 1.5;
      ctx.strokeStyle = '#c8c8d0'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(q.x, q.y - 4 + bob, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 10; ctx.fillRect(q.x - 7, q.y - 4 + bob, 14, 11); ctx.shadowBlur = 0;
      ctx.fillStyle = '#000'; ctx.fillRect(q.x - 1, q.y + bob, 2, 4);
    }
  }
  ctx.textAlign = 'center';
  ctx.font = `700 ${big ? 15 : 13}px ${SERIF}`; ctx.fillStyle = done ? '#7a8090' : rg.col;
  ctx.fillText(ROMAN[ri], g.x, top - w - (big ? 30 : 14));
  ctx.font = `600 12px ${SERIF}`; ctx.fillStyle = done ? '#6a7080' : '#e8e2f0';
  ctx.fillText(done ? 'Megtisztítva' : rg.name, g.x, base + 18);
}

function drawPedestal(pd) {
  const on = G.weapon === pd.w, y = pd.y, f = Math.sin(gt * 2 + pd.x) * 4;
  if (on) {
    const gr = ctx.createRadialGradient(pd.x, y, 2, pd.x, y, 60); gr.addColorStop(0, 'rgba(255,225,140,0.45)'); gr.addColorStop(1, 'rgba(255,225,140,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(pd.x, y, 60, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(pd.x, y + 16, 30, 8, 0, 0, TAU); ctx.fill();
  const sg = ctx.createLinearGradient(pd.x - 24, 0, pd.x + 24, 0); sg.addColorStop(0, '#4a5163'); sg.addColorStop(0.5, '#9aa3b8'); sg.addColorStop(1, '#3c4252');
  ctx.fillStyle = sg; ctx.fillRect(pd.x - 18, y - 4, 36, 20); ctx.fillRect(pd.x - 24, y - 10, 48, 8);
  ctx.save(); ctx.translate(pd.x, y - 34 + f);
  ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 18;
  if (pd.w === 'bow') {
    ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,233,168,0.8)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) { const a = gt + i * TAU / 8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20); ctx.stroke(); }
  } else {
    ctx.rotate(-Math.PI / 4 + Math.sin(gt * 1.5) * 0.1); drawBlade(0, 0, 1.25);
  }
  ctx.restore(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.font = `700 13px ${SERIF}`; ctx.fillStyle = on ? '#ffe27a' : '#c8cfe0';
  ctx.fillText(WEAPONS[pd.w].n, pd.x, y + 36);
  ctx.font = `10px ${SANS}`; ctx.fillStyle = on ? '#fff2c0' : '#8890a4';
  ctx.fillText(on ? 'FELSZERELVE' : 'lépj rá a cseréhez', pd.x, y + 50);
}
function drawBlade(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  const bg = ctx.createLinearGradient(0, -30, 0, 0); bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#ffe08a');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(4, -22); ctx.lineTo(3, 0); ctx.lineTo(-3, 0); ctx.lineTo(-4, -22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d9a63a'; ctx.fillRect(-9, 0, 18, 3); ctx.fillStyle = '#8a6a2a'; ctx.fillRect(-2, 3, 4, 8);
  ctx.fillStyle = '#fff2b0'; ctx.beginPath(); ctx.arc(0, 12, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHub() {
  const room = G.hubRoom, p = G.p;
  // fénysugarak felülről
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = 160 + i * 160 + Math.sin(gt * 0.3 + i) * 20, a = 0.035 + Math.sin(gt * 0.7 + i * 1.7) * 0.02;
    const lg = ctx.createLinearGradient(0, T, 0, B); lg.addColorStop(0, `rgba(220,235,255,${a})`); lg.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x - 20, T); ctx.lineTo(x + 20, T); ctx.lineTo(x + 90, B); ctx.lineTo(x - 50, B); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const g of room.gates) drawGate(g);
  for (const pd of room.peds) drawPedestal(pd);
  // ismertető: a legközelebbi kapu vagy útmutató
  let near = null, nd = 95;
  for (const g of room.gates) { const d = Math.hypot(p.x - g.x, p.y - g.y - 12); if (d < nd) { nd = d; near = g; } }
  ctx.textAlign = 'center';
  if (near) {
    const ri = near.ri, rg = RINGS[ri], done = G.defeated.includes(ri), locked = ri === 6 && G.defeated.length < 6;
    ctx.fillStyle = 'rgba(8,8,14,0.78)'; ctx.fillRect(CX - 228, CY - 10, 456, 74); ctx.strokeStyle = hexA(rg.col, 0.6); ctx.lineWidth = 1.5; ctx.strokeRect(CX - 228 + 0.5, CY - 9.5, 455, 73);
    ctx.font = `700 17px ${SERIF}`; ctx.fillStyle = rg.col; ctx.fillText(`${ROMAN[ri]}. ${rg.name} — ${BOSSES[ri].name}`, CX, CY + 14);
    ctx.font = `13px ${SANS}`; ctx.fillStyle = '#ddd';
    ctx.fillText(done ? 'Ez a bűn már elbukott, a kapu lepecsételve.' : locked ? `Lakatok zárják: győzd le a többi főbűnt (még ${6 - G.defeated.length}).` : 'Lépj be a kapun az alászálláshoz.', CX, CY + 34);
    ctx.fillStyle = '#b8b0c8'; ctx.font = `12px ${SANS}`; ctx.fillText(CURSE[ri], CX, CY + 53);
  } else {
    ctx.font = `13px ${SANS}`; ctx.fillStyle = 'rgba(220,230,255,0.55)';
    ctx.fillText(touch.on ? 'Bal hüvelykujj: mozgás  •  Jobb hüvelykujj: támadás  •  FEGYVER gomb: csere' : 'WASD: mozgás  •  Egér / nyilak: támadás  •  Space: kitérés  •  X: fegyvercsere', CX, CY + 20);
    ctx.fillText('Lépj be egy kapun. A Kevélység kapuját a másik hat bűn legyőzése nyitja.', CX, CY + 42);
  }
}

function drawDoors() {
  const r = G.room, rg = RG();
  for (const [dx, dy, k] of DIRS) {
    if (!r.doors[k]) continue;
    const nb = G.rooms[(r.x + dx) + ',' + (r.y + dy)], open = r.cleared;
    let x, y, w, h;
    if (k === 'n') { x = CX - DOOR; y = 64; w = DOOR * 2; h = T - 64; }
    else if (k === 's') { x = CX - DOOR; y = B; w = DOOR * 2; h = H - B; }
    else if (k === 'w') { x = 0; y = CY - DOOR; w = L; h = DOOR * 2; }
    else { x = R; y = CY - DOOR; w = W - R; h = DOOR * 2; }
    const tc = nb.type === 'boss' ? '#ff2a2a' : nb.type === 'treasure' ? '#ffd75e' : nb.type === 'shop' ? '#6fd8ff' : rg.col;
    ctx.fillStyle = '#050205'; ctx.fillRect(x, y, w, h);
    if (open) {
      const gr = k === 'n' || k === 's' ? ctx.createLinearGradient(0, k === 'n' ? y : y + h, 0, k === 'n' ? y + h : y) : ctx.createLinearGradient(k === 'w' ? x : x + w, 0, k === 'w' ? x + w : x, 0);
      gr.addColorStop(0, hexA(tc, 0.0)); gr.addColorStop(1, hexA(tc, 0.35 + Math.sin(gt * 3) * 0.08));
      ctx.fillStyle = gr; ctx.fillRect(x, y, w, h);
    } else {
      ctx.strokeStyle = hexA(rg.col, 0.85); ctx.lineWidth = 4; ctx.shadowColor = rg.col; ctx.shadowBlur = 10;
      ctx.beginPath();
      if (k === 'n' || k === 's') for (let i = 1; i < 5; i++) { ctx.moveTo(x + i * w / 5, y); ctx.lineTo(x + i * w / 5, y + h); }
      else for (let i = 1; i < 5; i++) { ctx.moveTo(x, y + i * h / 5); ctx.lineTo(x + w, y + i * h / 5); }
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    ctx.strokeStyle = hexA(tc, 0.9); ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }
}

function drawAngel(x, y, face, t, dark, alpha, scale = 1, weapon = null, swing = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  const flap = Math.sin(t * 9) * 0.22;
  // aura
  if (!dark) {
    const gr = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
    gr.addColorStop(0, 'rgba(255,240,190,0.35)'); gr.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
  }
  // szárnyak
  ctx.fillStyle = dark ? '#1b0f28' : '#f6f3ff'; ctx.strokeStyle = dark ? '#8a55c8' : '#d9c48a'; ctx.lineWidth = 1.5;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.scale(s, 1); ctx.translate(3, -2); ctx.rotate(-flap);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(10, -22, 30, -28, 40, -18);
    ctx.bezierCurveTo(34, -12, 37, -8, 33, -4);
    ctx.bezierCurveTo(33, 0, 29, 2, 25, 4);
    ctx.bezierCurveTo(22, 9, 14, 10, 4, 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(31, -15); ctx.moveTo(8, 0); ctx.lineTo(27, -4); ctx.moveTo(7, 3); ctx.lineTo(20, 5); ctx.stroke();
    ctx.restore();
  }
  // köntös
  ctx.fillStyle = dark ? '#120a1c' : '#ffffff';
  ctx.beginPath(); ctx.moveTo(-5, -7); ctx.lineTo(5, -7); ctx.lineTo(11, 15); ctx.quadraticCurveTo(0, 19, -11, 15); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dark ? '#8a55c8' : '#e8c25a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 2); ctx.lineTo(7, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 17); ctx.lineWidth = 1; ctx.stroke();
  // fej
  ctx.fillStyle = dark ? '#3d2a55' : '#ffe2c4'; ctx.beginPath(); ctx.arc(0, -13, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = dark ? '#5a2a8a' : '#f2c75a'; ctx.beginPath(); ctx.arc(0, -15, 7, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (dark) { ctx.fillStyle = '#ff3355'; ctx.fillRect(-4, -14, 2, 2); ctx.fillRect(2, -14, 2, 2); }
  // glória
  ctx.strokeStyle = dark ? '#b04fff' : '#ffd75e'; ctx.lineWidth = 2.5; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.ellipse(0, -25, 9, 3.2, 0, 0, TAU); ctx.stroke(); ctx.shadowBlur = 0;
  if (weapon === 'blade') {
    // égi penge: suhintáskor végigsöpör az íven
    const k = swing > 0 ? 1 - swing / 0.2 : 0.5, ba = face + (k - 0.5) * 2.2;
    ctx.save(); ctx.rotate(ba + Math.PI / 2); ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 12; drawBlade(0, -12, 0.95); ctx.restore(); ctx.shadowBlur = 0;
  } else {
    // fénygömb (célzás)
    ctx.fillStyle = dark ? '#b04fff' : '#fff6c8'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(Math.cos(face) * 20, Math.sin(face) * 20 - 2, 3, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawEnemy(e) {
  const rg = RG(), col = rg.col, fl = e.flash > 0;
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.spawn > 0) {
    const k = 1 - e.spawn / 0.7;
    ctx.strokeStyle = hexA(col, 0.8); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, e.r * 1.8 * (1 - k * 0.4), 0, TAU); ctx.stroke();
    ctx.rotate(gt * 3); ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = i * TAU * 2 / 5; ctx.lineTo(Math.cos(a) * e.r * 1.6, Math.sin(a) * e.r * 1.6); } ctx.closePath(); ctx.stroke();
    ctx.restore(); ctx.save(); ctx.translate(e.x, e.y); ctx.globalAlpha = k;
  }
  ctx.globalAlpha *= e.alpha;
  const a = angTo(e, G.p), r = e.r;
  if (!G.hub && G.ring === 6 && e.spawn <= 0) { // csábító aura
    const ar = 115, pl = 1 + Math.sin(gt * 3 + e.spin) * 0.05;
    const ag = ctx.createRadialGradient(0, 0, r, 0, 0, ar * pl); ag.addColorStop(0, 'rgba(255,170,230,0.22)'); ag.addColorStop(1, 'rgba(192,139,255,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, ar * pl, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,240,0.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 8]); ctx.lineDashOffset = -gt * 30;
    ctx.beginPath(); ctx.arc(0, 0, ar * pl, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    const d = dist(e, G.p);
    if (d < ar) { ctx.strokeStyle = `rgba(255,150,220,${0.5 * (1 - d / ar) + 0.15})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(G.p.x - e.x, G.p.y - e.y); ctx.stroke(); }
  }
  if (e.rage) { const rg2 = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2); rg2.addColorStop(0, 'rgba(255,60,20,0.5)'); rg2.addColorStop(1, 'rgba(255,60,20,0)'); ctx.fillStyle = rg2; ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, r * 0.8, r, r * 0.35, 0, 0, TAU); ctx.fill();
  const body = fl ? '#ffffff' : rg.body;
  const gr = ctx.createRadialGradient(-r * 0.3, -r * 0.4, 1, 0, 0, r * 1.2);
  gr.addColorStop(0, fl ? '#fff' : col); gr.addColorStop(1, body);
  ctx.fillStyle = gr; ctx.strokeStyle = fl ? '#fff' : hexA(col, 0.9); ctx.lineWidth = 1.5;
  const eyes = (sp = 0.38, ey = -0.15, es = 0.17, ec = '#ffef7a') => {
    const ox = Math.cos(a) * r * 0.18, oy = Math.sin(a) * r * 0.12;
    ctx.fillStyle = ec; ctx.shadowColor = ec; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(-r * sp + ox, r * ey + oy, r * es, 0, TAU); ctx.arc(r * sp + ox, r * ey + oy, r * es, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  };
  switch (e.type) {
    case 'imp': case 'mini': {
      ctx.beginPath(); ctx.moveTo(-r * 0.7, -r * 0.5); ctx.lineTo(-r * 0.9, -r * 1.3); ctx.lineTo(-r * 0.2, -r * 0.8); ctx.moveTo(r * 0.7, -r * 0.5); ctx.lineTo(r * 0.9, -r * 1.3); ctx.lineTo(r * 0.2, -r * 0.8);
      ctx.fillStyle = fl ? '#fff' : '#1a0a0a'; ctx.fill(); ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke(); eyes(); break;
    }
    case 'fly': {
      ctx.fillStyle = 'rgba(220,240,200,0.45)';
      const wf = Math.sin(gt * 50) * 0.4;
      ctx.beginPath(); ctx.ellipse(-r * 0.9, -r * 0.6, r * 0.8, r * 0.4, -0.5 + wf, 0, TAU); ctx.ellipse(r * 0.9, -r * 0.6, r * 0.8, r * 0.4, 0.5 - wf, 0, TAU); ctx.fill();
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke(); eyes(0.35, -0.1, 0.25, '#ff4040'); break;
    }
    case 'spitter': {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#100'; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5 + 2, r * 0.35, r * 0.25 + Math.sin(e.t * 8) * 1.5, a, 0, TAU); ctx.fill();
      eyes(0.35, -0.35, 0.15); break;
    }
    case 'brute': {
      if (e.st === 1) { ctx.strokeStyle = hexA('#ff2020', 0.5); ctx.lineWidth = r * 1.6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.ca) * 260, Math.sin(e.ca) * 260); ctx.stroke(); ctx.lineWidth = 1.5; ctx.strokeStyle = hexA(col, 0.9); }
      ctx.fillStyle = fl ? '#fff' : '#1a0a0a';
      ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.6); ctx.quadraticCurveTo(-r * 1.6, -r * 1.2, -r * 1.2, -r * 1.7); ctx.lineTo(-r * 0.2, -r * 0.8); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r * 0.6, -r * 0.6); ctx.quadraticCurveTo(r * 1.6, -r * 1.2, r * 1.2, -r * 1.7); ctx.lineTo(r * 0.2, -r * 0.8); ctx.fill();
      ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-r, -r * 0.9, r * 2, r * 1.9, r * 0.5) : ctx.rect(-r, -r * 0.9, r * 2, r * 1.9); ctx.fill(); ctx.stroke();
      eyes(0.4, -0.2, 0.14, '#ff5a3a'); ctx.fillStyle = '#100'; ctx.fillRect(-r * 0.4, r * 0.3, r * 0.8, r * 0.18); break;
    }
    case 'wisp': {
      ctx.shadowColor = col; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(0, -r * 1.7 - Math.sin(e.t * 9) * 3); ctx.quadraticCurveTo(r * 1.2, -r * 0.3, r, r * 0.3); ctx.arc(0, r * 0.3, r, 0, Math.PI); ctx.quadraticCurveTo(-r * 1.2, -r * 0.3, 0, -r * 1.7 - Math.sin(e.t * 9) * 3);
      ctx.fill(); ctx.shadowBlur = 0; eyes(0.33, 0.25, 0.16, '#ffffff'); break;
    }
    case 'splitter': {
      const wob = Math.sin(e.t * 6) * 0.08;
      ctx.beginPath(); ctx.ellipse(0, 0, r * (1 + wob), r * (1 - wob), 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(-r * 0.4, r * 0.35, r * 0.2, 0, TAU); ctx.arc(r * 0.45, r * 0.2, r * 0.15, 0, TAU); ctx.fill();
      ctx.fillStyle = '#100'; ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.5, r * 0.22, 0, 0, TAU); ctx.fill();
      eyes(0.35, -0.3, 0.17); break;
    }
    case 'turret': {
      ctx.beginPath(); for (let i = 0; i < 6; i++) { const q = i / 6 * TAU + e.spin * 0.2; ctx.lineTo(Math.cos(q) * r, Math.sin(q) * r); } ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = e.st === 1 ? '#fff' : '#ffef7a'; ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r * 0.28, 0, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.1, r * 0.15, 0, TAU); ctx.fill(); break;
    }
    case 'teleporter': {
      ctx.beginPath(); ctx.moveTo(0, -r * 1.5); ctx.lineTo(r * 1.1, r); ctx.quadraticCurveTo(0, r * 1.4, -r * 1.1, r); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, -r * 0.2, r * 0.55, r * 0.5, 0, 0, TAU); ctx.fill();
      eyes(0.22, -0.2, 0.12, col); break;
    }
    case 'shadow': ctx.restore(); drawAngel(e.x, e.y, a, e.t, true, e.alpha * (fl ? 0.6 : 1)); return;
    case 'boss': ctx.restore(); drawBoss(e); return;
  }
  if (e.burn > 0) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#ff9a2a'; ctx.beginPath(); ctx.arc(0, -r - 4, 3 + Math.sin(gt * 20), 0, TAU); ctx.fill(); }
  if (e.loot) { ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.font = `bold 12px ${SANS}`; ctx.fillStyle = '#000'; ctx.fillText(`◈${e.loot}`, 1, -r - 15); ctx.fillStyle = '#ffd700'; ctx.fillText(`◈${e.loot}`, 0, -r - 16); }
  ctx.restore();
  if (e.hp < e.maxHp && !e.boss) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - 16, e.y - e.r - 12, 32, 4);
    ctx.fillStyle = col; ctx.fillRect(e.x - 16, e.y - e.r - 12, 32 * Math.max(0, e.hp / e.maxHp), 4);
  }
}

function drawBoss(b) {
  const rg = RG(), col = rg.col, r = b.r, fl = b.flash > 0, a = angTo(b, G.p);
  if (b.tele != null) {
    ctx.strokeStyle = 'rgba(255,40,40,0.35)'; ctx.lineWidth = r * 1.8;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.cos(b.tele) * 900, b.y + Math.sin(b.tele) * 900); ctx.stroke();
  }
  if (b.key === 'leviathan') {
    for (let i = b.trail.length - 1; i > 0; i -= 4) {
      const q = b.trail[i], k = 1 - i / 60;
      ctx.globalAlpha = b.alpha * 0.9; ctx.fillStyle = i % 8 === 0 ? rg.body : col;
      ctx.beginPath(); ctx.arc(q.x, q.y, r * (0.4 + k * 0.5), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.save(); ctx.translate(b.x, b.y); ctx.globalAlpha = b.alpha * (b.inv > 0 ? 0.6 + Math.sin(gt * 30) * 0.3 : 1);
  if (b.intro > 0) { const k = Math.min(1, (2.6 - b.intro) / 1.2); ctx.scale(k, k); }
  // aura
  const pulse = 1 + Math.sin(gt * 4) * 0.08;
  const au = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.4 * pulse);
  au.addColorStop(0, hexA(col, 0.45)); au.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = au; ctx.beginPath(); ctx.arc(0, 0, r * 2.4 * pulse, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, r * 0.9, r * 1.1, r * 0.35, 0, 0, TAU); ctx.fill();
  if (b.key === 'lucifer') {
    // hat bukott szárny
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) {
      ctx.save(); ctx.scale(s, 1); ctx.rotate(-0.7 + k * 0.55 + Math.sin(gt * 2 + k) * 0.08);
      const wg = ctx.createLinearGradient(0, 0, r * 2.6, 0); wg.addColorStop(0, '#1a0b2e'); wg.addColorStop(1, b.phase === 3 ? '#ff4a24' : '#6a3ab0');
      ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(r * 0.3, 0);
      ctx.quadraticCurveTo(r * 1.4, -r * 0.6, r * 2.6, -r * 0.1);
      for (let j = 0; j < 4; j++) { ctx.lineTo(r * (2.3 - j * 0.45), r * 0.05 + (j % 2) * 4); ctx.lineTo(r * (2.1 - j * 0.45), -r * 0.12); }
      ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(255,215,94,0.35)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
  }
  if (b.key === 'beelzebub') {
    for (let i = 0; i < 10; i++) { const q = gt * 3 + i * 0.63; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(Math.cos(q) * r * 1.5, Math.sin(q * 1.3) * r * 1.2, 2.5, 0, TAU); ctx.fill(); }
  }
  // szarvak
  ctx.fillStyle = fl ? '#fff' : (b.key === 'lucifer' ? '#0d0618' : '#160808');
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * r * 0.45, -r * 0.7);
    ctx.quadraticCurveTo(s * r * 1.5, -r * 1.2, s * r * 1.1, -r * 2.0);
    ctx.quadraticCurveTo(s * r * 0.9, -r * 1.3, s * r * 0.15, -r * 0.85); ctx.fill();
  }
  // test
  const gr = ctx.createRadialGradient(-r * 0.3, -r * 0.4, 2, 0, 0, r * 1.2);
  gr.addColorStop(0, fl ? '#fff' : col); gr.addColorStop(0.6, fl ? '#fff' : rg.body); gr.addColorStop(1, '#050005');
  ctx.fillStyle = gr; ctx.strokeStyle = hexA(col, 0.9); ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (b.key === 'belphegor') ctx.ellipse(0, r * 0.1, r * 1.15, r * 0.95, 0, 0, TAU);
  else ctx.arc(0, 0, r, 0, TAU);
  ctx.fill(); ctx.stroke();
  // korona (Mammon, Lucifer)
  if (b.key === 'mammon' || b.key === 'lucifer') {
    ctx.fillStyle = '#ffd75e'; ctx.shadowColor = '#ffd75e'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.75);
    for (let i = 0; i <= 4; i++) { ctx.lineTo(-r * 0.6 + i * r * 0.3, -r * (i % 2 ? 1.0 : 1.35)); }
    ctx.lineTo(r * 0.6, -r * 0.75); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  }
  // szemek
  const ox = Math.cos(a) * r * 0.15, oy = Math.sin(a) * r * 0.1, ec = b.key === 'lucifer' ? (b.phase === 3 ? '#ff4a24' : '#ffffff') : '#fff36a';
  ctx.fillStyle = ec; ctx.shadowColor = ec; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.ellipse(-r * 0.35 + ox, -r * 0.15 + oy, r * 0.2, r * 0.09, 0.3, 0, TAU);
  ctx.ellipse(r * 0.35 + ox, -r * 0.15 + oy, r * 0.2, r * 0.09, -0.3, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#100'; ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.35); ctx.quadraticCurveTo(0, r * (0.6 + (b.atk ? 0.15 : 0)), r * 0.4, r * 0.35); ctx.quadraticCurveTo(0, r * 0.45, -r * 0.4, r * 0.35); ctx.fill();
  ctx.fillStyle = '#eee';
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.13 - 3, r * 0.38); ctx.lineTo(i * r * 0.13 + 3, r * 0.38); ctx.lineTo(i * r * 0.13, r * 0.48); ctx.fill(); }
  ctx.restore();
}

function drawRoomStuff() {
  const room = G.room;
  if (room.type === 'hub') drawHub();
  if (room.type === 'treasure') {
    const y = CY + Math.sin(gt * 2) * 4;
    ctx.fillStyle = '#2a2016'; ctx.fillRect(CX - 26, CY + 6, 52, 22); ctx.fillStyle = '#4a3a22'; ctx.fillRect(CX - 30, CY + 2, 60, 8);
    if (!room.taken) {
      const gr = ctx.createRadialGradient(CX, y - 12, 2, CX, y - 12, 60); gr.addColorStop(0, 'rgba(255,230,140,0.8)'); gr.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(CX, y - 12, 60, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6d0'; ctx.font = `28px ${SANS}`; ctx.textAlign = 'center'; ctx.fillText('✦', CX, y - 2);
      ctx.fillStyle = 'rgba(255,240,200,0.8)'; ctx.font = `13px ${SANS}`; ctx.fillText('Égi Oltár — lépj rá', CX, CY + 50);
    }
  }
  if (room.type === 'shop') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(160,230,255,0.85)'; ctx.font = `bold 18px ${SERIF}`; ctx.fillText('A Bűnbánó Lélek Boltja', CX, T + 60);
    ctx.font = `13px ${SANS}`; ctx.fillStyle = 'rgba(200,230,255,0.6)'; ctx.fillText('Állj egy tárgyra és nyomd meg az E gombot', CX, T + 82);
    for (const it of room.items) {
      ctx.fillStyle = '#1d2a33'; ctx.fillRect(it.x - 22, it.y + 8, 44, 16); ctx.fillStyle = '#2f4452'; ctx.fillRect(it.x - 26, it.y + 4, 52, 6);
      if (it.sold) continue;
      const y = it.y - 14 + Math.sin(gt * 2 + it.x) * 3;
      ctx.fillStyle = 'rgba(111,216,255,0.15)'; ctx.beginPath(); ctx.arc(it.x, y, 24, 0, TAU); ctx.fill();
      ctx.font = `26px ${SANS}`; ctx.fillStyle = it.heal ? '#ff5b7a' : '#fff2b0'; ctx.fillText(it.heal ? '♥' : it.bl.i, it.x, y + 9);
      ctx.font = `bold 14px ${SANS}`; ctx.fillStyle = G.souls >= it.price ? '#8fe8ff' : '#ff7a7a'; ctx.fillText('◈ ' + it.price, it.x, it.y + 44);
      if (dist(it, G.p) < 40) {
        const nm = it.heal ? 'Gyógyító Kegyelem' : it.bl.n, ds = it.heal ? '+40 életerő' : it.bl.d;
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(it.x - 150, it.y - 96, 300, 52);
        ctx.fillStyle = '#ffe27a'; ctx.font = `bold 15px ${SANS}`; ctx.fillText(nm + '  [E]', it.x, it.y - 75);
        ctx.fillStyle = '#ddd'; ctx.font = `13px ${SANS}`; ctx.fillText(ds, it.x, it.y - 55);
      }
    }
  }
  if (G.portal && G.portal.room === room) {
    const pt = G.portal, k = Math.min(1, pt.t);
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(255,${230 - i * 20},${180 - i * 30},${0.7 - i * 0.12})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, (40 - i * 6) * k, (56 - i * 8) * k, 0, gt * (i % 2 ? 2 : -2), gt * (i % 2 ? 2 : -2) + TAU * 0.8); ctx.stroke();
    }
    const gr = ctx.createRadialGradient(pt.x, pt.y, 2, pt.x, pt.y, 50 * k); gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(pt.x, pt.y, 50 * k, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff2c8'; ctx.font = `14px ${SERIF}`; ctx.textAlign = 'center';
    ctx.fillText('Vissza a Purgatóriumba', pt.x, pt.y + 80);
  }
}

function drawGame() {
  const p = G.p, room = G.room, sh = G.shake;
  ctx.save(); ctx.translate(rand(-sh, sh), rand(-sh, sh));
  ctx.drawImage(room.cache, 0, 0, W, H);
  drawTorches();
  drawDoors();
  drawRoomStuff();
  // veszélyzónák
  for (const h of G.hazards) {
    if (h.warn > 0) {
      ctx.strokeStyle = h.bile ? 'rgba(180,212,58,0.7)' : h.type === 'slow' ? 'rgba(150,180,230,0.7)' : 'rgba(255,120,40,0.8)'; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * (1 - h.warn * 0.3), 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    } else {
      const al = Math.min(1, h.life);
      const gr = ctx.createRadialGradient(h.x, h.y, 4, h.x, h.y, h.r);
      if (h.bile) { gr.addColorStop(0, `rgba(150,180,40,${0.55 * al})`); gr.addColorStop(1, `rgba(90,110,20,${0.12 * al})`); }

    const gr = ctx.createRadialGradient(r.w / 2, 90, 4, r.w / 2, 90, 70); gr.addColorStop(0, 'rgba(255,230,150,0.5)'); gr.addColorStop(1, 'rgba(255,230,150,0)');

    ctx.textAlign = 'center'; ctx.fillStyle = '#fff6d0'; ctx.font = `52px ${SANS}`; ctx.fillText(b.i, r.w / 2, 108);
    ctx.font = `700 19px ${SERIF}`; ctx.fillStyle = '#ffe27a'; ctx.fillText(b.n, r.w / 2, 170);
    ctx.font = `14px ${SANS}`; ctx.fillStyle = '#ddd'; wrapText(b.d, r.w / 2, 200, r.w - 40, 19);
    const own = G.blessings.filter(x => x === b.id).length;
    if (own) { ctx.fillStyle = '#9a8fa8'; ctx.font = `12px ${SANS}`; ctx.fillText(`Már birtokolt: ${own}×`, r.w / 2, r.h - 46); }
    ctx.fillStyle = '#887'; ctx.font = `bold 13px ${SANS}`; ctx.fillText(`[${i + 1}]`, r.w / 2, r.h - 22);
    ctx.restore();
  }
}
function wrapText(s, x, y, mw, lh) {
  const words = s.split(' '); let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > mw && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = t; }
  if (line) ctx.fillText(line, x, y);
}
function drawChoice() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.font = `900 34px ${SERIF}`; ctx.fillStyle = '#ffe27a'; ctx.shadowColor = '#ffd75e'; ctx.shadowBlur = 20;
  ctx.fillText(G.choice.src === 'boss' ? 'A BŰN ELBUKOTT' : 'ÉGI ÁLDÁS', CX, 120); ctx.shadowBlur = 0;
  ctx.font = `16px ${SANS}`; ctx.fillStyle = '#ccc'; ctx.fillText('Válassz egy áldást (kattintás vagy 1 / 2 / 3)', CX, 155);
  drawCards();
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.font = `900 40px ${SERIF}`; ctx.fillStyle = '#ffe27a'; ctx.fillText('SZÜNET', CX, 110);
  ctx.font = `15px ${SANS}`; ctx.fillStyle = '#ddd';
  const lines = ['WASD — mozgás', 'Bal egérgomb (nyomva tartva) vagy nyilak — lövés', 'Space / Shift — kitérés (sérthetetlen közben)', 'Q / jobb egérgomb — Szent Nova (ha a Kegyelem megtelt)',
    'E — vásárlás a boltban   •   X / Tab — fegyvercsere (Szent Fény / Égi Penge)', 'F — teljes képernyő   •   M — hang ki/be', '', 'Esc / Enter — folytatás   •   R — vissza a főmenübe'];
  lines.forEach((l, i) => ctx.fillText(l, CX, 160 + i * 24));
  ctx.font = `700 18px ${SERIF}`; ctx.fillStyle = '#ffe27a'; ctx.fillText('Áldásaid', CX, 380);
  const cnt = {}; G.blessings.forEach(id => cnt[id] = (cnt[id] || 0) + 1);
  const ids = Object.keys(cnt);
  ctx.font = `14px ${SANS}`; ctx.fillStyle = '#ccc';
  if (!ids.length) ctx.fillText('Még nincs áldásod.', CX, 410);
  ids.forEach((id, i) => { const b = BL.find(q => q.id === id); const col = i % 3, row = Math.floor(i / 3); ctx.fillText(`${b.i} ${b.n}${cnt[id] > 1 ? ' ×' + cnt[id] : ''}`, 200 + col * 280, 410 + row * 22); });
}

function updateAmbient(dt) {
  if (emb.length < 120) emb.push({ x: rand(0, W), y: H + 10, vy: rand(20, 70), vx: rand(-10, 10), s: rand(1, 3), c: Math.random() < 0.7 ? '#ff5a24' : '#ffd75e', l: rand(4, 10) });
  for (const e of emb) { e.y -= e.vy * dt; e.x += e.vx * dt + Math.sin(gt + e.y * 0.02) * 0.3; e.l -= dt; }
  for (let i = emb.length - 1; i >= 0; i--) if (emb[i].l <= 0 || emb[i].y < -10) emb.splice(i, 1);
  if (state === 'story') storyT += dt;
}
function drawEmbers() {
  ctx.globalCompositeOperation = 'lighter';
  for (const e of emb) { ctx.globalAlpha = Math.min(1, e.l / 2) * 0.8; ctx.fillStyle = e.c; ctx.fillRect(e.x, e.y, e.s, e.s); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function hellBg() {
  const g = ctx.createRadialGradient(CX, H + 100, 50, CX, H, 700); g.addColorStop(0, '#5a1205'); g.addColorStop(0.5, '#1a0508'); g.addColorStop(1, '#050208');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // a hét gyűrű
  for (let i = 0; i < 7; i++) {
    ctx.strokeStyle = hexA(RINGS[i].col, 0.18 + 0.05 * Math.sin(gt * 2 + i)); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(CX, H - 40, 440 - i * 58, 120 - i * 15, 0, Math.PI, TAU); ctx.stroke();
  }
  drawEmbers();
}
function drawTitle() {
  hellBg();
  ctx.textAlign = 'center';
  // fénysugár felülről
  const lg = ctx.createLinearGradient(0, 0, 0, 360); lg.addColorStop(0, 'rgba(255,240,190,0.25)'); lg.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(CX - 40, 0); ctx.lineTo(CX + 40, 0); ctx.lineTo(CX + 160, 360); ctx.lineTo(CX - 160, 360); ctx.fill();
  drawAngel(CX, 300 + Math.sin(gt * 1.5) * 8, Math.PI / 2, gt, false, 1, 2.6);
  ctx.font = `900 64px ${SERIF}`; ctx.fillStyle = '#000'; ctx.fillText('THE ARKANGEL', CX + 3, 133);
  const tg = ctx.createLinearGradient(0, 80, 0, 135); tg.addColorStop(0, '#fff8dc'); tg.addColorStop(1, '#d9a63a');
  ctx.fillStyle = tg; ctx.shadowColor = '#ffd75e'; ctx.shadowBlur = 25; ctx.fillText('THE ARKANGEL', CX, 130); ctx.shadowBlur = 0;
  ctx.font = `600 19px ${SERIF}`; ctx.fillStyle = '#e8c8a8'; ctx.fillText('Alászállás a Pokol hét gyűrűjén', CX, 168);
  ctx.globalAlpha = 0.6 + Math.sin(gt * 3) * 0.4; ctx.font = `700 20px ${SERIF}`; ctx.fillStyle = '#fff';
  ctx.fillText(touch.on ? 'Érintsd meg a kezdéshez' : 'Kattints vagy nyomj ENTER-t a kezdéshez', CX, 450); ctx.globalAlpha = 1;
  ctx.font = `13px ${SANS}`; ctx.fillStyle = '#b8a8a0';
  ctx.fillText(touch.on ? 'Bal hüvelykujj: mozgás  •  Jobb hüvelykujj: célzás és lövés (érintés = automatikus célzás)  •  Gombok: kitérés, Nova, vétel'
    : 'WASD mozgás  •  Egér / nyilak támadás  •  Space kitérés  •  Q Szent Nova  •  X fegyvercsere  •  E vásárlás  •  Esc szünet  •  F teljes képernyő', CX, 500);
  ctx.fillStyle = '#7a6a70';
  ctx.fillText(`Legtöbb legyőzött bűn: ${Math.min(7, best.ring)} / 7   •   Győzelmek: ${best.wins}`, CX, 530);
}
const STORY = [
  'Kezdetben volt a Fény.',
  'És volt egy, aki fényesebb akart lenni a Fénynél.',
  'Lucifer kevélysége — a főbűn, amelyből minden más bűn fakad —',
  'hét gyűrűre szakította a Pokol mélyét:',
  'Bujaság. Torkosság. Fösvénység. Restség. Harag. Irigység.',
  'És legalul, a jég trónján: a Kevélység.',
  '',
  'Az Ég elküldte utolsó harcosát a Purgatórium hét kapujához.',
  'Te vagy az Arkangyal.',
  'Szállj alá.',
];
function drawStory() {
  hellBg();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  STORY.forEach((l, i) => {
    const k = clamp((storyT - i * 0.9) / 0.8, 0, 1); if (!k) return;
    ctx.globalAlpha = k; ctx.font = i >= 8 ? `700 26px ${SERIF}` : `italic 19px Georgia,serif`;
    ctx.fillStyle = i >= 8 ? '#ffe27a' : '#e0d6c8'; ctx.fillText(l, CX, 130 + i * 36);
  });
  ctx.globalAlpha = 0.5 + Math.sin(gt * 3) * 0.3; ctx.font = `14px ${SANS}`; ctx.fillStyle = '#aaa';
  ctx.fillText('Kattints vagy nyomj ENTER-t', CX, H - 30); ctx.globalAlpha = 1;
}
function drawDead() {
  ctx.fillStyle = 'rgba(20,0,0,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.font = `900 60px ${SERIF}`; ctx.fillStyle = '#d8283c'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 25;
  ctx.fillText('ELBUKTÁL', CX, 200); ctx.shadowBlur = 0;
  ctx.font = `italic 18px Georgia,serif`; ctx.fillStyle = '#ccc'; ctx.fillText('A fény kihunyt… de a Menny újra elküld.', CX, 240);
  ctx.font = `16px ${SANS}`; ctx.fillStyle = '#ddd';
  const mm = Math.floor(G.time / 60), ss = Math.floor(G.time % 60);
  [G.hub ? 'A Purgatóriumban buktál el' : `Itt buktál el: ${ROMAN[G.ring]}. gyűrű — ${RINGS[G.ring].name}`, `Legyőzött démonok: ${G.kills}`, `Legyőzött bűnök: ${G.bossesKilled} / 7`, `Áldások: ${G.blessings.length}`, `Idő: ${mm}:${ss < 10 ? '0' : ''}${ss}`]
    .forEach((l, i) => ctx.fillText(l, CX, 300 + i * 28));
  ctx.globalAlpha = 0.6 + Math.sin(gt * 3) * 0.4; ctx.font = `700 20px ${SERIF}`; ctx.fillStyle = '#fff';
  ctx.fillText('ENTER / kattintás — új alászállás     Esc — főmenü', CX, 490); ctx.globalAlpha = 1;
}
function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, 0, 20, CX, 0, 700); g.addColorStop(0, `rgba(255,240,190,${Math.min(0.6, gt * 0.2)})`); g.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawEmbers();
  drawAngel(CX, 300 + Math.sin(gt * 1.5) * 6, -Math.PI / 2, gt, false, 1, 2.2);
  ctx.textAlign = 'center'; ctx.font = `900 46px ${SERIF}`; ctx.fillStyle = '#fff2c8'; ctx.shadowColor = '#ffd75e'; ctx.shadowBlur = 30;
  ctx.fillText('A KEVÉLYSÉG ELBUKOTT', CX, 120); ctx.shadowBlur = 0;
  ctx.font = `italic 18px Georgia,serif`; ctx.fillStyle = '#e8dcc8';
  ctx.fillText('A hét gyűrű megtisztult. A Pokol mélyén, először az idők kezdete óta, fény ragyog.', CX, 165);
  ctx.font = `16px ${SANS}`; ctx.fillStyle = '#ddd';
  const mm = Math.floor(G.time / 60), ss = Math.floor(G.time % 60);
  ctx.fillText(`Legyőzött démonok: ${G.kills}   •   Áldások: ${G.blessings.length}   •   Idő: ${mm}:${ss < 10 ? '0' : ''}${ss}`, CX, 440);
  ctx.globalAlpha = 0.6 + Math.sin(gt * 3) * 0.4; ctx.font = `700 20px ${SERIF}`; ctx.fillStyle = '#fff';
  ctx.fillText(touch.on ? 'Érintés — folytatás   •   ide érints — főmenü' : 'ENTER — vissza a főmenübe', CX, 500); ctx.globalAlpha = 1;
}

function render() {
  const s = cv.width / W; ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return drawRotateHint(); }
  if (state === 'story') { drawStory(); return drawRotateHint(); }
  if (G) drawGame();
  drawTouch();
  if (state === 'choice') drawChoice();
  else if (state === 'pause') drawPause();
  else if (state === 'dead') drawDead();
  else if (state === 'win') drawWin();
  drawRotateHint();
}

function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now; gt += dt;
  try {
    if (state === 'play') update(dt);
    else updateAmbient(dt);
    updateMusic(dt);
    render();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
// tesztelési horog
window.ARK = { get G() { return G; }, get state() { return state; }, set state(v) { state = v; }, startRun, nextRing, pick, killEnemy, enterRoom, goRoom, enterRing, enterHub, swapWeapon, hurtPlayer };
</script>
