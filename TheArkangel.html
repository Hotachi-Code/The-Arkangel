let AC = null, master = null, muted = false, NB = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol = 0.2, freq = 1000, delay = 0) {
  if (!AC || muted) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.05);
}

const lastS = {};

let musT = 0, musStep = 0;
const SCALE = [0, 3, 5, 7, 10, 12, 15];
const ROOTS = [55, 51.91, 49, 46.25, 58.27, 43.65, 41.2];
function updateMusic(dt) {
  if (!AC || muted) return;
  musT -= dt; if (musT > 0) return;
  const boss = state === 'play' && G && G.bossAlive;
  const tempo = boss ? 0.19 : (state === 'play' ? 0.4 : 0.6);
  musT += tempo; musStep++;
  const root = G && state !== 'title' && state !== 'story' ? (G.hub ? 65.4 : ROOTS[G.ring]) : ROOTS[6];
  if (musStep % 4 === 0) tone(root * (boss ? 2 : 1), tempo * 3.6, 'triangle', boss ? 0.11 : 0.08);
  if (boss && musStep % 2 === 1) tone(root * 2, tempo * 0.9, 'sawtooth', 0.025, -root);
  if (Math.random() < (boss ? 0.6 : 0.38)) tone(root * 4 * Math.pow(2, choice(SCALE) / 12), tempo * 2, 'sine', 0.025);
}

cv.addEventListener('mousemove', mpos);

addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });

// Bal térfél: mozgás-joystick. Jobb térfél: célzó-joystick (húzva lő; csak érintve a legközelebbi démonra lő).
// Gombok: kitérés, Szent Nova, vásárlás, szünet.

  dash: { x: W - 80, y: H - 80, r: 44, label: 'KITÉRÉS' },
  nova: { x: W - 190, y: H - 52, r: 34, label: 'NOVA' },
  use: { x: W - 175, y: H - 155, r: 32, label: 'VÉTEL' },
  swap: { x: W - 62, y: H - 192, r: 28, label: 'FEGYVER' },
  pause: { x: 742, y: 32, r: 20, label: '' },
};
function tpos(t) { const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H }; }
function shopItems() { const out = []; if (G && G.pois) for (const o of G.pois) if (o.type === 'shop' && o.items && Math.hypot(o.x - G.p.x, o.y - G.p.y) < 400) out.push(...o.items); return out; }
function nearShopItem() {
  if (!G || !G.pois) return null;
  for (const it of shopItems()) if (!it.sold && dist(it, G.p) <= 40) return it;
  return null;
}
function tbVisible(k) { if (G && G.hub && (k === 'swap' || k === 'nova')) return false; return k !== 'use' || !!nearShopItem(); }
function tryLandscape() {
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }
}
function touchStart(e) {
  e.preventDefault(); touch.on = true; audioInit();
  for (const t of e.changedTouches) {
    const q = tpos(t);
    if (state !== 'play') {
      // harc közben érkező érintések ne válasszanak/indítsanak véletlenül
      if ((state === 'dead' || state === 'win') && gt < 1.2) continue;
      if (state === 'choice' && performance.now() - G.choice.at < 700) continue;
      mouse.x = q.x; mouse.y = q.y;
      if (state === 'title') tryLandscape();
      if (state === 'pause' && q.y > 594 && Math.abs(q.x - CX) < 90) state = 'title';
      else onClick(0);
      continue;
    }
    if (q.y < 62 && q.x > 776) { state = 'map'; continue; }
    let hit = null;
    for (const k in TB) { const b = TB[k]; if (tbVisible(k) && Math.hypot(q.x - b.x, q.y - b.y) < b.r + 14) { hit = k; break; } }

    if (h.type === 'burn' && Math.random() < 0.4) part(h.x + rand(-h.r, h.r) * 0.7, h.y + rand(-h.r, h.r) * 0.7, '#ff7a2a', 1, 40, 0.6, 3);
  }

  }

  for (const k of G.pickupsAll) {
    k.t += dt; k.x += k.vx * dt; k.y += k.vy * dt; k.vx *= 0.9; k.vy *= 0.9;
    const d = dist(k, p);
    if (G.dying || d > 700) continue;

    }

  G.texts = G.texts.filter(t => t.life > 0);

}
function updatePlayer(dt) {

  const p = G.p;

      for (const e of G.enemies) { if (e.dead || e.ghost || e.spawn > 0) continue; const d = dist(e, b); if (d < bd) { bd = d; best = e; } }
      if (best) {
        const cur = Math.atan2(b.vy, b.vx), want = angTo(b, best), sp = Math.hypot(b.vx, b.vy);
        let df = ((want - cur + Math.PI) % TAU + TAU) % TAU - Math.PI;
        const na = cur + clamp(df, -p.homing * 5 * dt, p.homing * 5 * dt);

    }
    if (!b.f && b.homing) { const cur = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy), want = Math.atan2(p.y - b.y, p.x - b.x); let df = ((want - cur + Math.PI) % TAU + TAU) % TAU - Math.PI; const na = cur + clamp(df, -b.homing * dt, b.homing * dt); b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp; }

    if (b.life <= 0) { b.dead = true; if (b.f && b.onEnd) b.onEnd(b); if (b.burst) { radial(b.x, b.y, b.burst, 160, rand(0, 1), { col: '#c8dcff' }); part(b.x, b.y, '#c8dcff', 12, 150, 0.4, 3); } continue; }
    if (b.x < L - 300 || b.x > R + 300 || b.y < T - 300 || b.y > B + 300) { b.dead = true; if (b.f && b.onEnd) b.onEnd(b); continue; }

function drawGate(g) {
  const ri = g.ri, rg = RINGS[ri], big = ri === 6, done = G.defeated.includes(ri), locked = big && WORLD.K[WORLD.gateTiles[0]] === K_GATE;
  const w = big ? 40 : 30, top = g.y - (big ? 40 : 28), base = g.y + 28;
  const arch = r => { ctx.beginPath(); ctx.moveTo(g.x - r, base); ctx.lineTo(g.x - r, top); ctx.arc(g.x, top, r, Math.PI, 0); ctx.lineTo(g.x + r, base); ctx.closePath(); };

  const sg = ctx.createLinearGradient(g.x - w - 10, 0, g.x + w + 10, 0); sg.addColorStop(0, '#454b5c'); sg.addColorStop(0.5, done ? '#6a7080' : '#9aa2b4'); sg.addColorStop(1, '#3a4050');
  ctx.fillStyle = sg; arch(w + 9); ctx.fill();
  ctx.save(); arch(w); ctx.clip();
  if (locked) { ctx.fillStyle = '#1c1428'; ctx.fillRect(g.x - w, top - w, w * 2, base - top + w); }
  else { const ig = ctx.createLinearGradient(0, top - w, 0, base); ig.addColorStop(0, hexA(rg.col, done ? 0.15 : 0.45)); ig.addColorStop(1, 'rgba(10,8,14,0.9)'); ctx.fillStyle = ig; ctx.fillRect(g.x - w, top - w, w * 2, base - top + w); }
  ctx.restore();
  if (locked) {
    ctx.strokeStyle = '#5a5468'; ctx.lineWidth = 4; ctx.setLineDash([7, 4]);
    ctx.beginPath(); ctx.moveTo(g.x - w, top); ctx.lineTo(g.x + w, base - 6); ctx.moveTo(g.x + w, top); ctx.lineTo(g.x - w, base - 6); ctx.stroke(); ctx.setLineDash([]);
    for (let k = 0; k < 6; k++) {
      if (G.defeated.includes(k)) continue;
      const a = Math.PI + (k + 0.5) / 6 * Math.PI, x = g.x + Math.cos(a) * (w + 14), y = top + Math.sin(a) * (w + 14), c = RINGS[k].col;
      ctx.strokeStyle = '#c8c8d0'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y - 4, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = c; ctx.fillRect(x - 7, y - 4, 14, 11); ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y, 2, 4);
    }
  }
  ctx.textAlign = 'center'; ctx.font = `700 ${big ? 15 : 13}px ${SERIF}`; ctx.fillStyle = done ? '#7a8090' : rg.col;

// ---------- útkeresés: szélességi mező a játékos körül ----------
const FF = { R: 22, d: new Int16Array(45 * 45), ox: 0, oy: 0, t: 0 };
function updateFlowField(dt) {
  if ((FF.t -= dt) > 0) return; FF.t = 0.3;
  const p = G.p, R = FF.R, N = 2 * R + 1, ptx = Math.floor(p.x / TS), pty = Math.floor(p.y / TS);
  FF.ox = ptx - R; FF.oy = pty - R; FF.d.fill(-1);
  const q = new Int16Array(N * N * 2); let qh = 0, qt = 0;
  const si = R * N + R; FF.d[si] = 0; q[qt++] = R; q[qt++] = R;
  while (qh < qt) {
    const x = q[qh++], y = q[qh++], dv = FF.d[y * N + x];
    for (let k = 0; k < 4; k++) {
      const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const j = ny * N + nx; if (FF.d[j] >= 0) continue;
      const tk = tileAt((FF.ox + nx + 0.5) * TS, (FF.oy + ny + 0.5) * TS);
      if (blocksWalk(tk)) { FF.d[j] = 32000; continue; }
      FF.d[j] = dv + 1; q[qt++] = nx; q[qt++] = ny;
    }
  }
}
function flowDir(e) {
  const N = 2 * FF.R + 1, tx = Math.floor(e.x / TS) - FF.ox, ty = Math.floor(e.y / TS) - FF.oy;
  if (tx < 0 || ty < 0 || tx >= N || ty >= N) return null;
  let best = FF.d[ty * N + tx], bx = 0, by = 0; if (best < 0 || best >= 32000) best = 9999;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue; const x = tx + dx, y = ty + dy; if (x < 0 || y < 0 || x >= N || y >= N) continue;
    const v = FF.d[y * N + x]; if (v >= 0 && v < best) { if (dx && dy && (FF.d[ty * N + x] >= 32000 || FF.d[y * N + tx] >= 32000)) continue; best = v; bx = dx; by = dy; }
  }
  if (!bx && !by) return null;
  return Math.atan2((ty + by - ty) * 1, (tx + bx - tx) * 1);
}

// ---------- fő MI-ciklus ----------
function attackersNow() { let n = 0; for (const e of G.enemies) if (!e.boss && e.act && e.act.ph !== 'rec') n++; return n; }
function updEnemy(e, dt) {
  if (e.dead) return;
  const p = G.p;
  // a messzi, nyugvó démonok alszanak – nem terhelik a telefont
  if (!e.aggro && !e.boss && (Math.abs(e.x - p.x) > 1300 || Math.abs(e.y - p.y) > 1000)) return;
  if (e.flash > 0) e.flash -= dt;
  if (e.orbCd > 0) e.orbCd -= dt;
  if (e.dodgeCd > 0) e.dodgeCd -= dt;
  if (e.hurtT > 0) e.hurtT -= dt;
  if (e.poiseT > 0) e.poiseT -= dt; else if (e.poise < e.poiseMax) e.poise = Math.min(e.poiseMax, e.poise + e.poiseMax * 0.6 * dt);
  if (e.broken > 0) e.broken -= dt;
  if (e.stunB > 0) { e.stunB -= dt; e.moving = 0; collideObst(e); return; }
  e.t += dt; e.moving = 0;
  if (e.burn > 0) {
    e.burn -= dt; e.hp -= p.dmg * 0.4 * Math.max(1, p.burn) * dt;
    if (Math.random() < 0.3) G.parts.push({ x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r, e.r), vx: 0, vy: -60, life: 0.4, max: 0.4, col: '#ffb060', size: 3 });
    if (e.hp <= 0) { killEnemy(e); return; }
  }
  if (e.spawn > 0) { e.spawn -= dt; return; }
  if (e.kbx || e.kby) { e.x += e.kbx * dt; e.y += e.kby * dt; const f = Math.pow(0.002, dt); e.kbx *= f; e.kby *= f; if (Math.abs(e.kbx) + Math.abs(e.kby) < 8) e.kbx = e.kby = 0; }
  if (e.slowT > 0) e.slowT -= dt;
  for (const k in e.cds) if (e.cds[k] > 0) e.cds[k] -= dt * (e.boss && e.phase > 1 ? 1.25 : 1);
  if (!e.boss && G.ring === 4 && !G.hub && !e.rage && e.hp < e.maxHp * 0.5 && e.ri === 4) { e.rage = true; e.spd *= 1.4; floatText(e.x, e.y - e.r - 12, 'DÜH!', '#ff4a24', 0.8, 14); }
  const d = dist(e, p);
  e.hitWall = false;
  if (e.boss) { bossPhase(e, dt); if (e.intro > 0) { collideObst(e); return; } }
  if (e.stun > 0 && !e.boss) { e.stun -= dt; if (e.act && e.act.ph === 'wind') e.act = null; }
  else if (e.act) runAct(e, dt, d);
  else think(e, dt, d);
  collideObst(e);
  if (e.boss && e.key === 'leviathan') { e.trail.unshift({ x: e.x, y: e.y }); if (e.trail.length > 60) e.trail.pop(); }
}
function think(e, dt, d) {
  const p = G.p, def = EDEF[e.type] || EDEF.imp, sp = e.spd * (e.slowT > 0 ? 0.45 : 1) * (e.rage ? 1.15 : 1);
  // észlelés
  if (!e.aggro) {
    if (!G.dying && d < (def.sight || 400) && (d < 140 || losClear(e, p))) aggroOn(e);
    else { wander(e, dt, sp * 0.45); return; }
  }
  // póráz: ne kövesse a világ végéig
  const home = e.enc ? e.enc : e.home, hd = Math.hypot(e.x - home.x, e.y - home.y);
  if (!e.boss && (hd > 1300 || (d > 900 && !e.enc))) { e.aggro = false; e.wander = { x: home.x, y: home.y, t: 4 }; return; }
  if (G.dying || state !== 'play') { wander(e, dt, sp * 0.3); return; }
  e.face = angTo(e, p);
  // kitérés a baráti lövedékek elől
  if (def.agile && e.dodgeCd <= 0) for (const b of G.bullets) { if (!b.f || b.dead) continue; const bd = Math.hypot(b.x - e.x, b.y - e.y); if (bd < 110 && bd > 30) { const ba = Math.atan2(b.vy, b.vx); if (arcDiff(ba, Math.atan2(e.y - b.y, e.x - b.x)) < 0.4) { e.dodgeCd = 2.4; if (Math.random() < def.agile) { const s = Math.random() < 0.5 ? 1 : -1; e.kbx = Math.cos(ba + s * Math.PI / 2) * 380; e.kby = Math.sin(ba + s * Math.PI / 2) * 380; } break; } } }
  // döntés: támadás
